name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway values for the in-CI Postgres; real secrets live in Vercel.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres?sslmode=disable
      ADMIN_USER: admin
      ADMIN_PASS: ci-admin-password
      CRON_SECRET: ci-cron-secret-00000000
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Postgres (PGlite) for build-time prerendering and e2e tests.
      - name: Start database
        run: |
          npm run db:local -- --memory &
          npx --yes wait-on tcp:127.0.0.1:5433
      - run: npx prisma migrate deploy
      - run: npm run db:seed:test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
